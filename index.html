<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weekly">
<meta name="theme-color" content="#F7F8FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Weekly</title>
<style>
:root {
  --bg: #F7F8FA; --card: #FFFFFF; --line: #E4E7EB; --text: #2B2E34; --muted: #8A8F98;
  --green: #22A06B; --red: #D9365E; --soft: #EEF0F3;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111214; --card: #1B1D21; --line: #2A2D33; --text: #ECEDEF; --muted: #8E939C; --green: #4CC38A; --red: #F0698A; --soft: #24272C; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 16px/1.4 -apple-system, system-ui, "Segoe UI", sans-serif;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(32px + env(safe-area-inset-bottom, 0px)); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
input { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 12px; min-width: 0; outline: none; }
input:focus { border-color: var(--muted); }
select { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 10px 8px; min-width: 0; }
.bill { display: grid; grid-template-columns: 1fr 1fr 28px; gap: 6px; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.bill .name { grid-column: 1 / 3; }
main { max-width: 30rem; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.red { color: var(--red); }

.top { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
.top > div:last-child { text-align: right; }
.top > div { line-height: 1.5; }
.top b { color: var(--text); font-weight: 600; }
.hero { text-align: center; }
.hero .big { font-size: 52px; font-weight: 700; letter-spacing: -.02em; line-height: 1.05; color: var(--green); }
.hero .big.red { color: var(--red); }
.hero .sub { color: var(--muted); margin-top: 4px; }

.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.wk { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px 6px; text-align: center; }
.wk small { display: block; color: var(--muted); font-size: 12px; }
.wk b { font-weight: 600; font-size: 15px; }
.wk.past { opacity: .45; }
.wk.now { border-color: var(--text); }
.month { text-align: center; color: var(--muted); font-size: 14px; margin-top: -12px; }

form { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > input { flex: 1; }
.amt { flex: 0 0 7rem !important; text-align: right; }
.switch { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); user-select: none; cursor: pointer; white-space: nowrap; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 11px; background: var(--line); border: 0; padding: 0; position: relative; flex: 0 0 auto; cursor: pointer; transition: background .15s; }
.switch input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked { background: var(--green); }
.switch input:checked::after { transform: translateX(16px); }
.add { margin-left: auto; background: var(--text); color: var(--bg); border-radius: 8px; padding: 10px 18px; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); min-height: 1.2em; }

.head { display: flex; justify-content: space-between; align-items: baseline; }
.head .link { font-size: 13px; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 0 0 6px; }
.list { list-style: none; margin: 0; padding: 0; }
.list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.list li:last-child { border-bottom: 0; }
.list .mid { flex: 1; min-width: 0; }
.list .mid div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list .mid small { color: var(--muted); font-size: 13px; }
.x { color: var(--muted); font-size: 20px; line-height: 1; width: 28px; height: 28px; flex: 0 0 auto; }
.empty { color: var(--muted); font-size: 14px; padding: 6px 0; }

details { border-top: 1px solid var(--line); padding-top: 14px; }
summary { cursor: pointer; color: var(--muted); font-size: 14px; list-style: none; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "Edit"; color: var(--text); font-weight: 600; }
details[open] summary::after { content: "Done"; }
.setup { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.setup label { font-size: 13px; color: var(--muted); margin-top: 6px; }
.link { color: var(--green); font-weight: 600; font-size: 14px; align-self: flex-start; padding: 4px 0; }
#avgBox summary, #invBox summary { color: var(--text); font-weight: 600; }
#avgBox summary::after, #invBox summary::after { content: "Show"; }
#avgBox[open] summary::after, #invBox[open] summary::after { content: "Hide"; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: var(--soft); border-radius: 8px; padding: 3px; }
.seg button { padding: 7px 4px; border-radius: 6px; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--card); color: var(--text); font-weight: 600; }
.sub-h { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
.green { color: var(--green); }
#avgBox select { width: 100%; }
.list .end { text-align: right; flex: 0 0 auto; }
.list .end small { display: block; color: var(--muted); font-size: 13px; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--green); border-radius: 2px; }
.list li.total { font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="top">
    <div><span id="monthName"></span><br><span id="spent"></span></div>
    <div><span id="weekName"></span><br><span id="weekDates"></span></div>
  </div>

  <div class="hero">
    <div class="big num" id="left"></div>
    <div class="sub" id="leftSub"></div>
  </div>

  <div>
    <div class="weeks" id="weeks"></div>
  </div>
  <div class="month num" id="monthLeft"></div>

  <form id="buy" autocomplete="off">
    <div class="row">
      <input id="bName" placeholder="What did you buy?" maxlength="60" aria-label="Name">
      <input id="bAmt" class="amt num" inputmode="decimal" placeholder="€0.00" aria-label="Amount">
    </div>
    <div class="row">
      <input id="bCat" placeholder="Category" list="cats" maxlength="30" aria-label="Category">
      <label class="switch"><input type="checkbox" id="bSpread">Spread</label>
      <button class="add" type="submit">Add</button>
    </div>
    <div class="hint" id="hint"></div>
    <datalist id="cats"></datalist>
  </form>

  <section>
    <div class="head"><h2>This period</h2><button class="link" type="button" id="export">Export CSV</button></div>
    <ul class="list" id="purchases"></ul>
  </section>

  <details id="avgBox">
    <summary><span>Averages</span></summary>
    <div class="setup">
      <select id="avgRange" aria-label="Period">
        <option value="4">Last 4 weeks</option>
        <option value="8">Last 8 weeks</option>
        <option value="13">Last 3 months</option>
        <option value="26">Last 6 months</option>
        <option value="52">Last 12 months</option>
        <option value="custom">Custom dates</option>
      </select>
      <div class="row" id="avgCustom" hidden>
        <input type="date" id="avgFrom" aria-label="From"><input type="date" id="avgTo" aria-label="To">
      </div>
      <div class="hint" id="avgNote"></div>
      <ul class="list" id="avgList"></ul>
    </div>
  </details>

  <details id="invBox">
    <summary><span>Investments</span></summary>
    <div class="setup">
      <div class="seg" id="invKind">
        <button type="button" data-kind="buy" class="on">Buy</button>
        <button type="button" data-kind="sell">Sell</button>
        <button type="button" data-kind="value">Value now</button>
      </div>
      <form id="invForm" class="setup" style="margin:0" autocomplete="off">
        <div class="row" id="invTrade">
          <input id="iShares" class="num" inputmode="decimal" placeholder="Shares" aria-label="Shares">
          <input id="iPrice" class="num" inputmode="decimal" placeholder="Price/share" aria-label="Price per share">
          <input id="iFees" class="num" inputmode="decimal" placeholder="Fees" aria-label="Fees">
        </div>
        <div class="row" id="invValueRow" hidden>
          <input id="iValue" class="num" inputmode="decimal" placeholder="What all your shares are worth now (€)" aria-label="Value now">
        </div>
        <div class="row"><span class="hint" id="invHint"></span><button class="add" type="submit">Add</button></div>
      </form>
      <ul class="list" id="invStats"></ul>
      <ul class="list" id="invList"></ul>
    </div>
  </details>

  <details id="setupBox">
    <summary><span><span id="setupSum"></span><span id="syncNote" class="red"></span></span></summary>
    <div class="setup">
      <label for="income">Monthly income (after tax)</label>
      <input id="income" class="num" inputmode="decimal" placeholder="€0.00">
      <label for="payday">Payday (day of the month you get paid)</label>
      <input id="payday" class="num" inputmode="numeric" placeholder="1">
      <label>Recurring expenses</label>
      <div id="bills" class="setup" style="margin:0"></div>
      <button class="link" type="button" id="addBill">+ Add expense</button>
      <label for="syncUrl">Google Sheet sync (optional)</label>
      <input id="syncUrl" placeholder="Script URL: https://script.google.com/…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <input id="syncKey" type="password" placeholder="Key" autocomplete="off">
      <div class="row"><button class="link" type="button" id="syncConnect">Connect</button><span class="hint" id="syncStatus"></span></div>
    </div>
  </details>
</main>

<script>
(() => {
  // Data lives in this browser only. Same key/shape as the previous version, so old data carries over.
  const KEY = 'weekly:v1';
  let raw = {};
  try { raw = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch {}
  const OLD_CATS = { groceries: 'Groceries', fun: 'Fun' };
  const S = {
    income: Number(raw.income) || 0,
    payday: Number(raw.payday) || 1,         // the budget period runs from payday to the day before the next one
    bills: Array.isArray(raw.bills) ? raw.bills : [],
    purchases: (Array.isArray(raw.purchases) ? raw.purchases : []).map(p => ({ ...p, cat: OLD_CATS[p.cat] || p.cat || 'Other' })),
    sync: raw.sync || { url: '', key: '' },   // Google Sheet sync settings, only ever stored on this device
    queue: Array.isArray(raw.queue) ? raw.queue : [],  // changes not yet sent to the sheet
    avg: raw.avg || { range: '4', from: '', to: '' },  // chosen Averages range (this device only)
    inv: Array.isArray(raw.inv) ? raw.inv : [],  // investment entries: buy / sell / value
  };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

  const $ = s => document.querySelector(s);
  const fmt = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR' });
  const fmt0 = new Intl.NumberFormat('en-IE', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
  const m = n => fmt.format(Math.abs(n) < .005 ? 0 : n);
  const m0 = n => fmt0.format(Math.abs(n) < .5 ? 0 : n);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const parseAmt = v => { const n = parseFloat(String(v).replace(/[€\s]/g, '').replace(',', '.')); return isFinite(n) ? Math.round(n * 100) / 100 : NaN; };
  const pad = n => String(n).padStart(2, '0');
  const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  // Recurring expenses are counted per month: €120 yearly = €10 a month.
  const PER_MONTH = { weekly: 52 / 12, monthly: 1, quarterly: 1 / 3, yearly: 1 / 12 };
  const monthly = b => (b.amount || 0) * (PER_MONTH[b.freq] || 1);
  const DEFAULT_CATS = ['Groceries', 'Eating out', 'Transport', 'Shopping', 'Grooming', 'Fun'];

  const day = ds => new Date(+ds.slice(0, 4), +ds.slice(5, 7) - 1, +ds.slice(8, 10));
  const today = () => day(iso(new Date()));
  const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
  const daysBetween = (a, b) => Math.round((b - a) / 864e5);
  const md = d => d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  // A period runs from payday to the day before the next payday (payday 1 = calendar month;
  // payday 31 in a 30-day month = the 30th). It's split into 4 weeks; the last one takes the extra days.
  function periodOf(d) {
    const startIn = (y, mo) => new Date(y, mo, Math.min(S.payday, new Date(y, mo + 1, 0).getDate()));
    let start = startIn(d.getFullYear(), d.getMonth());
    if (d < start) start = startIn(d.getFullYear(), d.getMonth() - 1);
    const next = startIn(start.getFullYear(), start.getMonth() + 1);
    return { start, next, end: addDays(next, -1), from: iso(start), to: iso(addDays(next, -1)) };
  }
  const weekIn = (p, ds) => Math.min(3, Math.floor(daysBetween(p.start, day(ds)) / 7));

  // Weekly allowance = (income - recurring) / 4.
  // A normal purchase comes out of its own week. A spread purchase is split evenly
  // over its own week and every week left after it.
  function compute() {
    const p = periodOf(today());
    const fixed = S.bills.reduce((a, b) => a + monthly(b), 0);
    const free = S.income - fixed;
    const weeks = [0, 1, 2, 3].map(i => ({ start: addDays(p.start, i * 7), end: i === 3 ? p.end : addDays(p.start, i * 7 + 6), allow: free / 4, spent: 0 }));
    const list = S.purchases.filter(x => x.date && x.date >= p.from && x.date <= p.to);
    let total = 0;
    for (const x of list) {
      const k = weekIn(p, x.date);
      total += x.amount;
      if (x.spread) { const share = x.amount / (4 - k); for (let j = k; j < 4; j++) weeks[j].allow -= share; }
      else weeks[k].spent += x.amount;
    }
    weeks.forEach(w => w.left = w.allow - w.spent);
    return { p, fixed, free, weeks, list, total, cur: weekIn(p, iso(today())) };
  }

  function render() {
    const r = compute(), w = r.weeks[r.cur];
    $('#monthName').textContent = `${md(r.p.start)} – ${md(r.p.end)}`;
    $('#weekName').textContent = `Week ${r.cur + 1} of 4`;
    $('#weekDates').textContent = `${md(w.start)} – ${md(w.end)}`;
    $('#spent').innerHTML = `<b class="num">${m(r.total)}</b> spent`;

    $('#left').textContent = m(w.left);
    $('#left').classList.toggle('red', w.left < -0.004);
    $('#leftSub').textContent = S.income > 0 ? `left this week · of ${m(w.allow)}` : 'Set your income and expenses below';

    $('#weeks').innerHTML = r.weeks.map((x, i) =>
      `<div class="wk${i < r.cur ? ' past' : ''}${i === r.cur ? ' now' : ''}"><small>W${i + 1}</small><b class="num${x.left < -0.4 ? ' red' : ''}">${m0(x.left)}</b></div>`).join('');

    const ml = r.free - r.total;
    $('#monthLeft').innerHTML = `<span class="${ml < 0 ? 'red' : ''}">${m(ml)}</span> left until ${md(r.p.next)}`;

    const items = [...r.list].sort((a, b) => (b.date + b.t).localeCompare(a.date + a.t));
    $('#purchases').innerHTML = items.length ? items.map(p => {
      const n = 4 - weekIn(r.p, p.date);
      return `<li><div class="mid"><div>${esc(p.note || p.cat)}</div><small>${esc(p.cat)} · ${md(day(p.date))}${p.spread && n > 1 ? ` · spread over ${n} wks` : ''}</small></div>
        <span class="num">${m(p.amount)}</span><button class="x" type="button" data-del="${p.id}" aria-label="Delete">×</button></li>`;
    }).join('') : '<li class="empty">Nothing yet this period.</li>';

    const cats = [...new Set([...S.purchases.map(p => p.cat), ...DEFAULT_CATS])];
    $('#cats').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');

    $('#setupSum').textContent = `${m(S.income)} income − ${m(r.fixed)} fixed = ${m(r.free / 4)}/week`;
    hint();
    renderAvg();
    renderInv(r.p);
    renderSync();
  }

  // Average spending per category over a chosen range. Spread purchases count in full on their date.
  // The range never starts before your first purchase, so a new app doesn't drag the average down.
  function renderAvg() {
    const v = S.avg.range, t0 = today();
    $('#avgCustom').hidden = v !== 'custom';
    let from = v === 'custom' ? (S.avg.from ? day(S.avg.from) : null) : addDays(t0, -7 * Number(v) + 1);
    const to = v === 'custom' && S.avg.to ? day(S.avg.to) : t0;
    const first = S.purchases.reduce((a, p) => !a || p.date < a ? p.date : a, '');
    if (!first) { $('#avgNote').textContent = 'No purchases yet.'; $('#avgList').innerHTML = ''; return; }
    let clipped = false;
    if (!from || from < day(first)) { from = day(first); clipped = true; }
    if (to < from) { $('#avgNote').textContent = 'Pick an end date after the start date.'; $('#avgList').innerHTML = ''; return; }
    const days = daysBetween(from, to) + 1, f = iso(from), t = iso(to);
    const by = {};
    let total = 0;
    for (const p of S.purchases) if (p.date >= f && p.date <= t) { by[p.cat] = (by[p.cat] || 0) + p.amount; total += p.amount; }
    const perWeek = x => x / days * 7, perMonth = x => x / days * 365.25 / 12;
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]);
    $('#avgNote').textContent = `${md(from)} – ${md(to)} · ${days} day${days === 1 ? '' : 's'}${clipped ? ' (since your first purchase)' : ''}`;
    $('#avgList').innerHTML = rows.length ? rows.map(([c, x]) => `<li><div class="mid"><div>${esc(c)}</div><div class="bar"><i style="width:${x / rows[0][1] * 100}%"></i></div></div>
        <div class="end num">${m(perWeek(x))}/wk<small>${m(perMonth(x))}/mo</small></div></li>`).join('') +
      `<li class="total"><div class="mid"><div>Total</div></div><div class="end num">${m(perWeek(total))}/wk<small>${m(perMonth(total))}/mo</small></div></li>`
      : '<li class="empty">No purchases in this range.</li>';
  }

  // ---------- investments ----------
  // buy: you put in shares × price + fees. sell: you take out shares × price − fees.
  // value: what all your shares are worth that day. Gain/loss = latest value + taken out − put in.
  let invKind = 'buy';
  const invAmt = e => e.kind === 'buy' ? e.shares * e.price + e.fees : e.kind === 'sell' ? e.shares * e.price - e.fees : e.value;
  const signed = n => (n > 0.004 ? '+' : '') + m(n);
  function renderInv(p) {
    const sum = (list, kind) => list.filter(e => e.kind === kind).reduce((a, e) => a + invAmt(e), 0);
    const inPeriod = S.inv.filter(e => e.date >= p.from && e.date <= p.to);
    const spent = S.purchases.filter(x => x.date >= p.from && x.date <= p.to).reduce((a, x) => a + x.amount, 0);
    const byTime = [...S.inv].sort((a, b) => (b.date + b.t).localeCompare(a.date + a.t));
    const last = byTime.find(e => e.kind === 'value');
    const row = (label, val, cls = '') => `<li><div class="mid"><div>${label}</div></div><div class="end num ${cls}">${val}</div></li>`;
    let html = `<li class="sub-h">This period (${md(p.start)} – ${md(p.end)})</li>`
      + row('Put in', m(sum(inPeriod, 'buy'))) + row('Taken out', m(sum(inPeriod, 'sell'))) + row('Spent on purchases', m(spent))
      + '<li class="sub-h">All time</li>';
    if (last) {
      const gain = last.value + sum(S.inv, 'sell') - sum(S.inv, 'buy');
      html += row(`Worth now <small class="muted">(${md(day(last.date))})</small>`, m(last.value))
        + row('Gain / loss', signed(gain), gain < -0.004 ? 'red' : gain > 0.004 ? 'green' : '');
    } else {
      html += row('Put in', m(sum(S.inv, 'buy'))) + row('Taken out', m(sum(S.inv, 'sell')))
        + '<li class="empty">Add a "Value now" to see your gain or loss.</li>';
    }
    $('#invStats').innerHTML = html;
    $('#invList').innerHTML = (byTime.length ? '<li class="sub-h">Entries</li>' : '') + byTime.slice(0, 12).map(e => {
      const what = e.kind === 'value' ? 'Value now'
        : `${e.kind === 'buy' ? 'Buy' : 'Sell'} · ${e.shares} × ${m(e.price)}${e.fees ? ` ${e.kind === 'buy' ? '+' : '−'} ${m(e.fees)} fees` : ''}`;
      return `<li><div class="mid"><div>${what}</div><small>${md(day(e.date))}</small></div>
        <span class="num">${e.kind === 'sell' ? '+' : ''}${m(invAmt(e))}</span><button class="x" type="button" data-delinv="${e.id}" aria-label="Delete">×</button></li>`;
    }).join('');
    invHint();
  }
  function invHint() {
    const sh = parseAmt($('#iShares').value), pr = parseAmt($('#iPrice').value), fe = parseAmt($('#iFees').value) || 0;
    $('#invHint').textContent = invKind !== 'value' && sh > 0 && pr > 0
      ? (invKind === 'buy' ? `You put in ${m(sh * pr + fe)}` : `You get ${m(sh * pr - fe)}`) : '';
  }

  function renderBills() {
    $('#bills').innerHTML = S.bills.map(b => `<div class="bill">
      <input class="name" data-bill="${b.id}" data-f="name" value="${esc(b.name)}" placeholder="Rent, insurance, Spotify…" maxlength="40">
      <button class="x" type="button" data-delbill="${b.id}" aria-label="Remove">×</button>
      <input data-bill="${b.id}" data-f="amount" class="num" inputmode="decimal" value="${b.amount ? b.amount.toFixed(2) : ''}" placeholder="€0.00">
      <select data-bill="${b.id}" data-f="freq" aria-label="How often">${Object.keys(PER_MONTH).map(f =>
        `<option value="${f}"${(b.freq || 'monthly') === f ? ' selected' : ''}>${f[0].toUpperCase() + f.slice(1)}</option>`).join('')}</select></div>`).join('');
  }

  function hint() {
    const amt = parseAmt($('#bAmt').value), p = periodOf(today()), n = 4 - weekIn(p, iso(today()));
    let t = '';
    if ($('#bSpread').checked) {
      t = n > 1 ? (amt > 0 ? `${m(amt / n)}/week off the next ${n} weeks (incl. this one)` : `Splits the cost over the ${n} weeks left`)
        : 'Last week before payday, so it all counts this week';
    }
    $('#hint').textContent = t;
  }

  // ---------- Google Sheet sync (see sync.gs) ----------
  // Every change is queued on the device and sent in batches, so nothing is lost while offline.
  // Each sync gets the whole sheet back, so all devices show the same data.
  let syncing = false, syncTimer, syncErr = '';
  const syncOn = () => !!(S.sync.url && S.sync.key);
  const budgetOp = () => ({ type: 'budget', income: S.income, payday: S.payday, bills: S.bills.map(({ name, amount, freq }) => ({ name, amount, freq: freq || 'monthly' })) });
  function queue(op) {
    if (!syncOn()) return;
    if (op.type === 'budget') S.queue = S.queue.filter(o => o.type !== 'budget');  // only the latest budget matters
    S.queue.push({ ...op, qid: uid() });
    save();
    clearTimeout(syncTimer); syncTimer = setTimeout(flush, 1500);
  }
  async function flush() {
    if (!syncOn() || syncing) return renderSync();
    syncing = true; renderSync();
    const ops = S.queue.slice(0, 500);
    try {
      const res = await fetch(S.sync.url, { method: 'POST', body: JSON.stringify({ key: S.sync.key, ops }) });
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'failed');
      const sent = new Set(ops.map(o => o.qid));
      S.queue = S.queue.filter(o => !sent.has(o.qid));
      if (Array.isArray(j.purchases)) applyServer(j);
      save();
      syncErr = '';
    } catch (err) {
      syncErr = err.message === 'wrong key' ? 'Wrong key' : "Couldn't reach the sheet, will retry";
    }
    syncing = false; render();
    if (!syncErr && S.queue.length) flush();
  }
  // The sheet is the source of truth; changes still waiting to be sent are re-applied on top.
  function applyServer(j) {
    let list = j.purchases;
    for (const op of S.queue) {
      if (op.type === 'add') list = list.filter(p => p.id !== op.p.id).concat([op.p]);
      else if (op.type === 'del') list = list.filter(p => p.id !== op.id);
    }
    S.purchases = list;
    if (Array.isArray(j.inv)) {
      let inv = j.inv;
      for (const op of S.queue) {
        if (op.type === 'inv') inv = inv.filter(e => e.id !== op.e.id).concat([op.e]);
        else if (op.type === 'invdel') inv = inv.filter(e => e.id !== op.id);
      }
      S.inv = inv;
    }
    const editing = S.queue.some(o => o.type === 'budget') || document.activeElement?.matches('#income, #payday, #bills input, #bills select');
    if (!j.hasBudget) {  // sheet has no budget yet: this device's becomes the starting point
      if (S.income > 0 || S.bills.some(b => b.name || b.amount)) queue(budgetOp());
      return;
    }
    if (editing) return;
    S.income = j.income;
    $('#income').value = S.income ? S.income.toFixed(2) : '';
    if (j.payday) { S.payday = j.payday; $('#payday').value = S.payday; }
    const same = S.bills.length === j.bills.length && S.bills.every((b, i) => b.name === j.bills[i].name && b.amount === j.bills[i].amount && (b.freq || 'monthly') === j.bills[i].freq);
    if (!same) { S.bills = j.bills.map(b => ({ id: uid(), ...b })); renderBills(); }
  }
  function renderSync() {
    const n = S.queue.length, waiting = n ? ` (${n} change${n === 1 ? '' : 's'} waiting)` : '';
    $('#syncStatus').textContent = !syncOn() ? 'Not connected' : syncing ? 'Syncing…' : syncErr ? syncErr + waiting : n ? `${n} change${n === 1 ? '' : 's'} waiting` : 'Synced ✓';
    $('#syncNote').textContent = syncOn() && syncErr ? ' · not synced' : '';
  }

  // ---------- events ----------
  $('#buy').addEventListener('submit', e => {
    e.preventDefault();
    const amt = parseAmt($('#bAmt').value);
    if (!(amt > 0)) { $('#bAmt').focus(); return; }
    S.purchases.push({ id: uid(), note: $('#bName').value.trim(), cat: $('#bCat').value.trim() || 'Other',
      amount: amt, date: iso(new Date()), spread: $('#bSpread').checked, t: String(Date.now()) });
    save();
    queue({ type: 'add', p: S.purchases.at(-1) });
    $('#bName').value = ''; $('#bAmt').value = ''; $('#bCat').value = ''; $('#bSpread').checked = false;
    render();
    $('#bName').focus();
  });
  $('#bAmt').addEventListener('input', hint);
  $('#bSpread').addEventListener('change', hint);

  $('#purchases').addEventListener('click', e => {
    const id = e.target.dataset?.del;
    if (!id) return;
    S.purchases = S.purchases.filter(p => p.id !== id); save(); queue({ type: 'del', id }); render();
  });

  $('#income').value = S.income ? S.income.toFixed(2) : '';
  $('#income').addEventListener('input', e => { S.income = parseAmt(e.target.value) || 0; save(); queue(budgetOp()); render(); });
  $('#payday').value = S.payday;
  $('#payday').addEventListener('input', e => {
    const d = parseInt(e.target.value, 10);
    if (!(d >= 1 && d <= 31)) return;
    S.payday = d; save(); queue(budgetOp()); render();
  });

  $('#invKind').addEventListener('click', e => {
    const k = e.target.dataset?.kind;
    if (!k) return;
    invKind = k;
    document.querySelectorAll('#invKind button').forEach(b => b.classList.toggle('on', b.dataset.kind === k));
    $('#invTrade').hidden = k === 'value'; $('#invValueRow').hidden = k !== 'value';
    invHint();
  });
  ['#iShares', '#iPrice', '#iFees'].forEach(id => $(id).addEventListener('input', invHint));
  $('#invForm').addEventListener('submit', e => {
    e.preventDefault();
    const entry = { id: uid(), date: iso(new Date()), kind: invKind, shares: 0, price: 0, fees: 0, value: 0, t: String(Date.now()) };
    if (invKind === 'value') {
      entry.value = parseAmt($('#iValue').value);
      if (!(entry.value >= 0)) { $('#iValue').focus(); return; }
    } else {
      entry.shares = parseAmt($('#iShares').value); entry.price = parseAmt($('#iPrice').value); entry.fees = parseAmt($('#iFees').value) || 0;
      if (!(entry.shares > 0)) { $('#iShares').focus(); return; }
      if (!(entry.price > 0)) { $('#iPrice').focus(); return; }
    }
    S.inv.push(entry); save(); queue({ type: 'inv', e: entry });
    ['#iShares', '#iPrice', '#iFees', '#iValue'].forEach(id => $(id).value = '');
    render();
  });
  $('#invList').addEventListener('click', e => {
    const id = e.target.dataset?.delinv;
    if (!id) return;
    S.inv = S.inv.filter(x => x.id !== id); save(); queue({ type: 'invdel', id }); render();
  });

  $('#avgRange').value = S.avg.range; $('#avgFrom').value = S.avg.from; $('#avgTo').value = S.avg.to;
  const editAvg = () => { S.avg = { range: $('#avgRange').value, from: $('#avgFrom').value, to: $('#avgTo').value }; save(); renderAvg(); };
  ['#avgRange', '#avgFrom', '#avgTo'].forEach(id => $(id).addEventListener('change', editAvg));

  const editBill = e => {
    const b = S.bills.find(x => x.id === e.target.dataset.bill);
    if (!b) return;
    const f = e.target.dataset.f;
    if (f === 'name') b.name = e.target.value;
    else if (f === 'freq') b.freq = e.target.value;
    else b.amount = parseAmt(e.target.value) || 0;
    save(); queue(budgetOp()); render();
  };
  $('#bills').addEventListener('input', editBill);
  $('#bills').addEventListener('change', e => { if (e.target.tagName === 'SELECT') editBill(e); });
  $('#bills').addEventListener('click', e => {
    const id = e.target.dataset?.delbill;
    if (!id) return;
    S.bills = S.bills.filter(b => b.id !== id); save(); queue(budgetOp()); renderBills(); render();
  });
  $('#addBill').addEventListener('click', () => {
    S.bills.push({ id: uid(), name: '', amount: 0, freq: 'monthly' }); save(); renderBills();
    $('#bills .bill:last-child input').focus();
  });

  // All purchases ever (every month) as a CSV. On iPhone this opens the share sheet → "Save to Files".
  $('#export').addEventListener('click', async () => {
    const q = v => /[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    const rows = [...S.purchases].sort((a, b) => (a.date + a.t).localeCompare(b.date + b.t))
      .map(p => [p.date, q(p.note || ''), q(p.cat), p.amount.toFixed(2), p.spread ? 'yes' : 'no'].join(','));
    const csv = ['date,name,category,amount,spread', ...rows].join('\n') + '\n';
    const file = new File([csv], `spending-${iso(new Date())}.csv`, { type: 'text/csv' });
    if (navigator.canShare?.({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(file); a.download = file.name;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });

  // Connect (or reconnect) sends this device's purchases once (the sheet ignores duplicates),
  // then loads what's in the sheet. The budget is only sent if the sheet doesn't have one yet.
  $('#syncUrl').value = S.sync.url; $('#syncKey').value = S.sync.key;
  $('#syncConnect').addEventListener('click', () => {
    const url = $('#syncUrl').value.trim(), key = $('#syncKey').value.trim();
    if (url && !/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) { $('#syncStatus').textContent = 'That is not a Google Apps Script URL'; return; }
    S.sync = { url, key }; S.queue = []; syncErr = ''; save();
    S.purchases.forEach(p => queue({ type: 'add', p }));
    S.inv.forEach(e => queue({ type: 'inv', e }));
    clearTimeout(syncTimer); flush();
  });
  window.addEventListener('online', flush);

  // refresh when reopened on a new day / week / month
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); flush(); } });

  if (!(S.income > 0)) $('#setupBox').open = true;
  renderBills();
  render();
  flush();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
